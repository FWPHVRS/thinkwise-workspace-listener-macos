name: Build and test macOS app
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build universal app and run watcher tests
        run: bash scripts/build.sh
      - name: Verify both CPU architectures
        run: |
          ARCHS=$(lipo -archs 'build/SQL Folder Listener.app/Contents/MacOS/SQLFolderListener')
          [[ " $ARCHS " == *" arm64 "* && " $ARCHS " == *" x86_64 "* ]]
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: SQL-Folder-Listener-${{ matrix.os }}
          path: dist/*
