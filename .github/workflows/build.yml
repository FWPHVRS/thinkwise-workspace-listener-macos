name: Build and test macOS app
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app and run watcher tests
        run: bash scripts/build.sh
      - name: Verify both CPU architectures
        run: lipo -verify_arch arm64 x86_64 'build/SQL Folder Listener.app/Contents/MacOS/SQLFolderListener'
      - uses: actions/upload-artifact@v4
        with:
          name: SQL-Folder-Listener-${{ matrix.os }}
          path: dist/*
